%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/eswin,eic7700-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Eswin EIC7700 SoC Usb Controller

maintainers:
  - Wei Yang <yangwei1@eswincomputing.com>
  - Senchuan Zhang <zhangsenchuan@eswincomputing.com>

description:
  The Usb controller on EIC7700 SoC.

properties:
  compatible:
    const: eswin,eic7700-usb

  reg:
    maxItems: 3

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: peripheral

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: suspend
      - const: aclk
      - const: cfg_clk

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: vaux

  eswin,hsp-sp-csr:
    description: HSP SP control register.
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - interrupt-parent
  - clocks
  - clock-names
  - resets
  - reset-names
  - eswin,hsp-sp-csr

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        usb@50480000{
            compatible = "eswin,eic7700-dwc3";
            reg = <0x0 0x50480000 0x0 0x10000>;
            clocks = <&clock 270>,
                    <&clock 545>,
                    <&clock 546>;
            clock-names = "suspend","aclk", "cfg_clk";
            eswin,hsp-sp-csr = <&hsp_sp_csr 0x800 0x808 0x83c 0x840>;
            resets = <&reset 0x07 (1 << 15)>;
            reset-names = "vaux";
            ranges;
            #address-cells = <2>;
            #size-cells = <2>;

            dwc3@50480000 {
                compatible = "snps,dwc3";
                reg = <0x0 0x50480000 0x0 0x10000>;
                #address-cells = <2>;
                #size-cells = <2>;
                interrupt-parent = <&plic>;
                interrupts = <85>;
                interrupt-names = "peripheral";
                dr_mode = "peripheral";
                phy_type = "utmi";
                maximum-speed = "high-speed";
                eswin,hsp-sp-csr = <&hsp_sp_csr 0x1044>;
                snps,dis_enblslpm_quirk;
                snps,dis-u2-freeclk-exists-quirk;
                snps,dis_u2_susphy_quirk;
                snps,dis-del-phy-power-chg-quirk;
                snps,parkmode-disable-ss-quirk;
            };
        };
    };
