%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/eswin,eic7700-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Eswin EIC7700 PCIe host controller

maintainers:
  - Yu Ning <ningyu@eswincomputing.com>
  - Senchuan Zhang <zhangsenchuan@eswincomputing.com>

description:
  The PCIe controller on EIC7700 SoC.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#

properties:
  compatible:
    const: eswin,eic7700-pcie

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: dbi
      - const: config
      - const: mgmt

  '#interrupt-cells':
    const: 1

  interrupts:
    minItems: 9
    maxItems: 9

  interrupt-names:
    items:
      - const: msi
      - const: inta
      - const: intb
      - const: intc
      - const: intd

  interrupt-controller:
    type: object

  interrupt-map:
    maxItems: 4

  interrupt-map-mask:
    items:
      - const: 0
      - const: 0
      - const: 0
      - const: 7

  clocks:
    maxItems: 4

  clock-names:
    items:
      - const: aclk
      - const: cfg
      - const: cr
      - const: aux

  resets:
    minItems: 1
    maxItems: 3

  reset-names:
    items:
      - const: cfg
      - const: powerup
      - const: pwren

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - interrupt-map-mask
  - interrupt-map
  - '#interrupt-cells'
  - clocks
  - clock-names
  - resets
  - reset-names

unevaluatedProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie: pcie@54000000 {
            compatible = "eswin,eic7700-pcie";
            reg = <0x0 0x54000000 0x0 0x4000000>,
                <0x0 0x40000000 0x0 0x800000>,
                <0x0 0x50000000 0x0 0x100000>;
            reg-names = "dbi", "config", "mgmt";
            ranges = <0x81000000 0x0 0x40800000 0x0 0x40800000 0x0 0x800000>,
                    <0x82000000 0x0 0x41000000 0x0 0x41000000 0x0 0xf000000>,
                    <0xc3000000 0x80 0x00000000 0x80 0x00000000 0x2 0x00000000>;

            bus-range = <0x0 0xff>;
            device_type = "pci";
            num-lanes = <0x4>;

            clocks = <&clock 562>,
                    <&clock 563>,
                    <&clock 564>,
                    <&clock 565>;
            clock-names = "aclk", "cfg", "cr", "aux";
            reset-names = "cfg", "powerup", "pwren";
            resets = <&reset 8 (1 << 0)>,
                    <&reset 8 (1 << 1)>,
                    <&reset 8 (1 << 2)>;

            #address-cells = <3>;
            #size-cells = <2>;
            #interrupt-cells = <1>;
            interrupts = <220>, <179>, <180>, <181>, <182>;
            interrupt-names = "msi", "inta", "intb", "intc", "intd";
            interrupt-parent = <&plic>;
            interrupt-map-mask = <0x0 0x0 0x0 0x7>;
            interrupt-map = <0x0 0x0 0x0 0x1 &plic 179>,
                            <0x0 0x0 0x0 0x2 &plic 180>,
                            <0x0 0x0 0x0 0x3 &plic 181>,
                            <0x0 0x0 0x0 0x4 &plic 182>;
          };
    };
